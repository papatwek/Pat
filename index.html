<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dry Run — Chat Trainer</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#1c2530;background:#ebeee8}*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#5b6570;font-size:.9rem}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:16px}.panel{background:#fbfcfa;border:1px solid #d7dad1;border-radius:12px;overflow:hidden}.head{padding:16px;border-bottom:1px solid #d7dad1}.log{height:430px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.customer{align-self:flex-start;background:white;border:1px solid #d7dad1}.agent{align-self:flex-end;background:#1c2530;color:white}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #d7dad1}.composer textarea{flex:1;min-width:0;resize:vertical;padding:10px;border:1px solid #c5cbc1;border-radius:8px}.btn,select,input,textarea{font:inherit}.btn{border:1px solid #b9c0b5;border-radius:8px;padding:9px 12px;cursor:pointer;background:white}.primary{background:#d79a3b;border-color:#d79a3b}.btn:disabled{opacity:.5;cursor:not-allowed}.field{display:grid;gap:6px;margin-bottom:12px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #c5cbc1;border-radius:8px;background:white}.side{padding:16px}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8eee9;font-size:.8rem}.notice{padding:10px 12px;background:#f5efd9;border-bottom:1px solid #ded4ad;font-size:.85rem}.empty{text-align:center;margin:auto;color:#5b6570}.history{max-height:180px;overflow:auto;font-size:.85rem}@media(max-width:760px){.layout{grid-template-columns:1fr}.log{height:50vh}.app{padding:12px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><h1>Dry Run</h1><div class="muted">A standalone live-chat practice trainer</div></div><button class="btn" id="reset" type="button">New session</button></header>
<div class="notice"><strong>Training only.</strong> Use invented information. Sessions are stored only in this browser.</div>
<section class="layout">
<div class="panel"><div class="head"><div class="top"><div><strong id="ticket">No active case</strong><div class="muted" id="meta">Choose a scenario to begin.</div></div><span class="status" id="status">Idle</span></div></div><div class="log" id="log"><div class="empty">Choose a scenario and start the practice chat.</div></div><form class="composer" id="form"><textarea id="reply" rows="2" maxlength="2000" placeholder="Type your customer-service reply…" disabled></textarea><button class="btn primary" id="send" type="submit" disabled>Send</button></form></div>
<aside class="panel side"><h2>Case setup</h2><div class="field"><label for="scenario">Scenario</label><select id="scenario"><option value="connectivity">Device offline</option><option value="account">Account login trouble</option><option value="footage">Missing footage</option><option value="hardware">Hardware issue</option><option value="shipping">Shipping delay</option><option value="billing">Billing question</option></select></div><div class="field"><label for="mood">Customer mood</label><select id="mood"><option>Calm</option><option>Frustrated</option><option>Confused</option><option>Very upset</option></select></div><button class="btn primary" id="start" type="button">Start scenario</button><hr><h3>Case notes</h3><div class="field"><label for="notes">Notes</label><textarea id="notes" rows="6" maxlength="5000" placeholder="Recap, troubleshooting, next steps…"></textarea></div><button class="btn" id="save" type="button">Save notes</button><p class="muted" id="saved" aria-live="polite"></p><h3>Previous sessions</h3><div class="history" id="history">None yet.</div></aside>
</section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const scenarioText={connectivity:'My camera suddenly went offline and I cannot get it connected again.',account:'I cannot sign in to my account even though I believe my password is correct.',footage:'An important event clip is missing and I am not sure whether it was saved.',hardware:'My camera is behaving strangely and the video quality has become unreliable.',shipping:'My order has not arrived yet and the delivery estimate has already passed.',billing:'I have a question about a charge on my subscription.'};
const state={messages:[],started:false,busy:false,session:null};
function safeRead(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function safeWrite(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function render(){const log=$('log');log.replaceChildren();if(!state.messages.length){const e=document.createElement('div');e.className='empty';e.textContent='Choose a scenario and start the practice chat.';log.append(e)}else state.messages.forEach(m=>{const e=document.createElement('div');e.className='msg '+m.role;e.textContent=m.text;log.append(e)});log.scrollTop=log.scrollHeight;$('ticket').textContent=state.session?state.session.ticket:'No active case';$('meta').textContent=state.session?state.session.meta:'Choose a scenario to begin.';$('status').textContent=state.busy?'Working…':state.started?'Open':'Idle';$('reply').disabled=!state.started||state.busy;$('send').disabled=!state.started||state.busy||!$('reply').value.trim()}
function renderHistory(){const items=safeRead('dry-run-history',[]);$('history').textContent=items.length?items.map(x=>x.ticket+' — '+x.scenario).join('\n'):'None yet.'}
function start(){state.started=true;state.busy=false;state.messages=[];state.session={ticket:'WZ-'+Math.floor(100000+Math.random()*900000),scenario:$('scenario').value,meta:$('mood').value+' customer · '+$('scenario').selectedOptions[0].text};state.messages.push({role:'customer',text:scenarioText[state.session.scenario]});$('notes').value='';$('saved').textContent='';render()}
function save(){if(!state.session){$('saved').textContent='Start a scenario first.';return}$('saved').textContent=safeWrite('dry-run-notes-'+state.session.ticket,$('notes').value)?'Notes saved locally.':'Could not save notes.';const history=safeRead('dry-run-history',[]).filter(x=>x.ticket!==state.session.ticket);history.unshift({ticket:state.session.ticket,scenario:$('scenario').selectedOptions[0].text});safeWrite('dry-run-history',history.slice(0,20));renderHistory()}
$('start').addEventListener('click',start);$('reset').addEventListener('click',start);$('save').addEventListener('click',save);$('reply').addEventListener('input',render);$('reply').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});
$('form').addEventListener('submit',async e=>{e.preventDefault();const text=$('reply').value.trim();if(!text||state.busy||!state.started)return;state.busy=true;state.messages.push({role:'agent',text});$('reply').value='';render();await new Promise(r=>setTimeout(r,350));state.messages.push({role:'customer',text:'Thanks. Please walk me through the next troubleshooting step, and let me know what information you need from me.'});state.busy=false;render()});
renderHistory();render();
</script>
</body>
</html>
